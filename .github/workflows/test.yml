name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds the Engine bundles and runs the tests against both the readable and the minified build.
      - run: npm test
      # dist/ is what gets deployed to n8n, so it must match the sources.
      - name: dist/ is up to date
        run: git diff --exit-code -- dist
